# Nginx como reverse proxy de origen único en producción.
# Sustituye al bypass de NEXT_PUBLIC_API_URL: con Nginx delante, frontend y
# backend quedan en el mismo origen y el streaming SSE del chat atraviesa el
# proxy sin bufferizarse.
#
# No confundir con la configuración de desarrollo: en desarrollo no hay
# Nginx (backend y frontend corren nativos, ver docker-compose.yml y
# next.config.ts); este fichero solo se usa con docker-compose.prod.yml.

# Rate limiting.
# Este fichero se monta como /etc/nginx/conf.d/default.conf, que la imagen
# base nginx:1.27-alpine incluye dentro de su bloque http {} — por eso
# limit_req_zone puede declararse aquí, a nivel de fichero, sin envolverlo
# en un bloque http {} propio.
#
# Dos zonas, ambas por IP (clave $binary_remote_addr, 10m ~ 160k IPs):
#   auth_limit — 5 peticiones/minuto: login y establecimiento de contraseña.
#     Suficiente para un uso legítimo (nadie falla el login 5 veces en un
#     minuto en circunstancias normales); restrictivo ante fuerza bruta.
#   api_limit  — 60 peticiones/minuto (1 r/s de media): el resto de la API,
#     incluido el chat. limit_req solo se evalúa al ABRIR cada petición, no
#     mientras dura una respuesta ya en curso — un stream SSE de chat ya
#     aceptado no se ve afectado por su propia duración (ver location
#     /api/ más abajo).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # No anunciar la versión exacta de Nginx (cabecera Server y páginas de
    # error propias): reduce la información gratuita disponible para un
    # atacante que busque CVEs de una versión concreta.
    server_tokens off;

    # 429 (Too Many Requests) en vez del 503 por defecto de limit_req: es el
    # código semánticamente correcto para "límite de tasa superado", y así
    # lo puede distinguir el cliente de una caída real del backend.
    limit_req_status 429;

    # Respuesta JSON breve al superar el límite, con el mismo contrato
    # {"detail": "..."} que usa el backend en sus HTTPException — el
    # manejo de errores que ya tiene el frontend (lee `body.detail` de
    # cualquier respuesta no-ok, ver frontend/src/app/chat/[asignaturaId]
    # /page.tsx) lo muestra correctamente sin cambios en el cliente.
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Demasiadas peticiones. Espera un momento e inténtalo de nuevo."}';
    }

    # Cabeceras de seguridad comunes a toda la respuesta. Nginx NO hereda
    # add_header de "server" en una location que ya declara los suyos
    # propios (aquí, /api/, por X-Accel-Buffering) — por eso se repiten
    # explícitamente dentro de esa location más abajo.
    #
    # X-XSS-Protection se omite a propósito: es una cabecera obsoleta (los
    # navegadores actuales ya no implementan el filtro que activaba, y en
    # navegadores antiguos podía incluso abrirse a bypasses) — la
    # Content-Security-Policy de abajo es el equivalente moderno.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP básica: origen único (Nginx) para todo — bloquea recursos externos
    # y el framing por terceros (frame-ancestors hace X-Frame-Options
    # redundante, pero se mantiene por compatibilidad con clientes que no
    # interpreten CSP).
    # 'unsafe-inline' en script-src es necesario: el App Router de Next.js
    # hidrata con <script> inline (self.__next_f.push(...)) — sin él la
    # aplicación no hidrata. Limitación conocida: una CSP estricta sin
    # 'unsafe-inline' requeriría nonces por petición generados por Next.js
    # (middleware), fuera de alcance aquí.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # RF-P4: documentos de hasta 20 MB. Margen sobre MAX_FILE_SIZE del backend.
    client_max_body_size 25m;

    # Login y establecimiento de contraseña: límite estricto contra fuerza
    # bruta. location = (coincidencia exacta) tiene la
    # prioridad más alta en Nginx, así que estas dos rutas se evalúan antes
    # que el prefijo /api/ de más abajo sin necesidad de reordenar nada.
    # burst=3 nodelay: hasta 3 peticiones de más en ráfaga se aceptan sin
    # esperar (un usuario que se equivoca de contraseña un par de veces
    # seguidas no nota el límite); a partir de ahí, 429.
    location = /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://backend:8000/auth/login;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/establecer-password {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://backend:8000/auth/establecer-password;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* → backend FastAPI, con el mismo prefijo y comportamiento
    # (recorta /api) que el rewrite de next.config.ts en desarrollo — así
    # ningún fetch relativo del frontend ("/api/...") necesita cambiar.
    location /api/ {
        # api_limit: 60 r/min con burst=20 nodelay — generoso para uso
        # normal (incluido el chat). Se evalúa una sola vez, al aceptar la
        # petición: un POST /chat/{id} que pasa el límite abre su stream
        # SSE con total normalidad y no vuelve a consultarse el límite
        # mientras el stream sigue abierto, así que una conversación en
        # curso nunca se corta por rate limiting (verificado manualmente).
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000/;

        # Streaming SSE del chat (POST /chat/{id}): sin esto, Nginx bufferiza
        # la respuesta completa antes de reenviarla y los tokens llegan de
        # golpe en vez de progresivamente (el mismo problema que resolvía el
        # bypass del proxy de Turbopack en desarrollo).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        # Cabeceras de seguridad (repetidas: ver nota arriba sobre herencia
        # de add_header por location en Nginx).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Generación LLM con RAG + revisión puede tardar bastante
        # (RNF-2: < 20 s objetivo, pero sin margen no hay red de seguridad).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto de rutas → frontend Next.js.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
